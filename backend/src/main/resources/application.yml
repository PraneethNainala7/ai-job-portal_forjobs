server:
  port: 8080

spring:
  application:
    name: ai-job-portal
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aijobportal}
    username: ${DATABASE_USER:aijob}
    password: ${DATABASE_PASSWORD:aijob}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-use-a-long-random-secret-key-value-64}
    expiration-ms: 604800000
  cookie-name: aip_session
  cookie-secure: ${COOKIE_SECURE:false}
  upload-dir: ${UPLOAD_DIR:uploads}
  bootstrap-admin:
    email: ${ADMIN_EMAIL:admin@aijobportal.com}
    password: ${ADMIN_PASSWORD:admin_123}
    name: ${ADMIN_NAME:Admin}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:"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"}
    model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}

logging:
  level:
    com.aijobportal: INFO
