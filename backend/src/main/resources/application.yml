server:
  port: 8080

spring:
  application:
    name: ai-job-portal
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/aijobportal}
    username: ${DATABASE_USER:aijob}
    password: ${DATABASE_PASSWORD:aijob}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

app:
  mail:
    enabled: ${MAIL_ENABLED:false}
    from-name: AI Job Portal
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  password-reset:
    expiration-minutes: 60
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-use-a-long-random-secret-key-value-64}
    expiration-ms: 604800000
  cookie-name: aip_session
  cookie-secure: ${COOKIE_SECURE:false}
  upload-dir: ${UPLOAD_DIR:uploads}
  bootstrap-admin:
    email: ${ADMIN_EMAIL:admin@aijobportal.com}
    password: ${ADMIN_PASSWORD:admin_123}
    name: ${ADMIN_NAME:Admin}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}
  ai:
    recommendation-min-score: 60
    recommendation-max-results: 12
    recommendation-batch-size: 20
  matching:
    weights:
      required-skills: 50
      preferred-skills: 15
      experience: 20
      role-relevance: 10
      education: 5
    skill-credits:
      exact: 1.0
      related: 0.5
      transferable: 0.2
    caps:
      zero-critical-max-score: 30
      low-required-ratio-threshold: 0.30
      low-required-max-score: 35
    rounding: HALF_UP
  google:
    client-id: ${GOOGLE_CLIENT_ID:371497904463-hnd22p0e4119mjo6ta7b7r5lf08k9p5n.apps.googleusercontent.com}

logging:
  level:
    com.aijobportal: INFO
