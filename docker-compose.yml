services:
  postgres:
    image: postgres:16-alpine
    container_name: aijobportal-postgres
    environment:
      POSTGRES_DB: aijobportal
      POSTGRES_USER: aijob
      POSTGRES_PASSWORD: aijob
    ports:
      - "5432:5432"
    volumes:
      - aijobportal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aijob -d aijobportal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  aijobportal-pgdata:
